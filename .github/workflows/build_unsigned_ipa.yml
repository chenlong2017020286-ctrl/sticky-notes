name: Build Unsigned IPA

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ master ]

jobs:
  build_ios:
    runs-on: macos-latest     # 使用 GitHub 免费的 macOS 运行器
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned IPA
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p output
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr ../../../output/StickyNotes-unsigned.ipa Payload/
          cd ../../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-unsigned-iOS
          path: output/StickyNotes-unsigned.ipa
